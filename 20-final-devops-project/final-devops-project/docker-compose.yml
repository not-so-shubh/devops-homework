services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: release_tracker
      POSTGRES_USER: release_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U release_tracker -d release_tracker"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://release_tracker:${POSTGRES_PASSWORD:-local-development-only}@database:5432/release_tracker
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on:
      backend: {condition: service_healthy}
    ports: ["8088:8080"]
volumes:
  postgres-data:
