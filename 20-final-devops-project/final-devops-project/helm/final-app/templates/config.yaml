apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-database
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@database:5432/%s" .Values.postgres.username .Values.postgres.password .Values.postgres.database | quote }}
