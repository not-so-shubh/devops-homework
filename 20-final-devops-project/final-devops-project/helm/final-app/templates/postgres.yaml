{{- if .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: {storage: {{ .Values.postgres.storage }}}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-database
  labels: {app.kubernetes.io/name: release-tracker-database, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: release-tracker-database, app.kubernetes.io/instance: {{ .Release.Name }}}
  strategy: {type: Recreate}
  template:
    metadata:
      labels: {app.kubernetes.io/name: release-tracker-database, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{name: postgres, containerPort: 5432}]
          envFrom:
            - secretRef: {name: {{ .Release.Name }}-database}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe: {exec: {command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: postgres}, periodSeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-postgres}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  selector: {app.kubernetes.io/name: release-tracker-database, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
