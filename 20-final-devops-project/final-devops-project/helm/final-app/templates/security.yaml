apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-backend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: release-tracker-backend, app.kubernetes.io/instance: {{ .Release.Name }}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: release-tracker-frontend, app.kubernetes.io/instance: {{ .Release.Name }}}
