replicaCount: 2
image:
  repository: ghcr.io/not-so-shubh/final-devops-project
  tag: latest
  pullPolicy: Always
config:
  message: Final DevOps Project deployed with Helm
  environment: production
secret:
  create: true
  demoToken: lab-only-placeholder
service:
  port: 80
ingress:
  enabled: true
  className: nginx
  host: final-devops.local
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPU: 60
persistence:
  enabled: true
  size: 1Gi
resources:
  requests: {cpu: 25m, memory: 32Mi}
  limits: {cpu: 250m, memory: 128Mi}
