groups:
  - name: release-tracker
    rules:
      - alert: ReleaseTrackerDown
        expr: up{job="release-tracker-backend"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Final application target is unavailable"}
      - alert: ReleaseTrackerHighRestartRate
        expr: increase(kube_pod_container_status_restarts_total{namespace="final-devops"}[10m]) > 2
        labels: {severity: warning}
        annotations: {summary: "Final application containers are restarting"}
      - alert: ReleaseTrackerHighErrorRate
        expr: sum(rate(release_tracker_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(release_tracker_http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Release Tracker HTTP 5xx rate is above 5%"}
