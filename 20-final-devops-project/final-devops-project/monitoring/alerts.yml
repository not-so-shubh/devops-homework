groups:
  - name: final-app
    rules:
      - alert: FinalAppDown
        expr: up{job="final-app"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Final application target is unavailable"}
      - alert: FinalAppHighRestartRate
        expr: increase(kube_pod_container_status_restarts_total{namespace="final-devops"}[10m]) > 2
        labels: {severity: warning}
        annotations: {summary: "Final application containers are restarting"}
      - alert: FinalAppHighCPU
        expr: rate(container_cpu_usage_seconds_total{namespace="final-devops",pod=~"final-app-.*"}[5m]) > 0.2
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Final application CPU is near its limit"}
