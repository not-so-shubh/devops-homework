apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: final-app
  namespace: final-devops
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: final-app}
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown: {stabilizationWindowSeconds: 120}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: final-app
  namespace: final-devops
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: final-app}
