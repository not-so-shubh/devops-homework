apiVersion: apps/v1
kind: Deployment
metadata:
  name: final-app
  namespace: final-devops
  labels: {app: final-app}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: final-app}
  template:
    metadata:
      labels: {app: final-app}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ghcr.io/not-so-shubh/final-devops-project:latest
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: final-app-config}
          env:
            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef: {name: final-app-secret, key: DEMO_TOKEN}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: {command: ["sh", "-c", "sleep 5"]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: final-app-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: final-app
  namespace: final-devops
  labels: {app: final-app}
spec:
  selector: {app: final-app}
  ports: [{name: http, port: 80, targetPort: http}]
