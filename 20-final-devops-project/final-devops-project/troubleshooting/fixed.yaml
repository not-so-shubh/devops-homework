apiVersion: v1
kind: Namespace
metadata: {name: final-troubleshooting}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: app-config, namespace: final-troubleshooting}
data: {APP_MODE: healthy}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: trouble-app, namespace: final-troubleshooting}
spec:
  replicas: 2
  selector:
    matchLabels: {app: trouble-app}
  template:
    metadata:
      labels: {app: trouble-app}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          envFrom:
            - configMapRef: {name: app-config}
          readinessProbe: {httpGet: {path: /, port: 80}}
---
apiVersion: v1
kind: Service
metadata: {name: trouble-app, namespace: final-troubleshooting}
spec:
  selector: {app: trouble-app}
  ports: [{port: 80, targetPort: 80}]
