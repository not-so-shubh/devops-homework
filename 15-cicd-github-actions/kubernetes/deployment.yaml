apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
  namespace: devops-demo
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: cicd-demo}
  template:
    metadata:
      labels: {app: cicd-demo}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ghcr.io/not-so-shubh/devops-homework:latest
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: APP_MESSAGE, value: "Hello from the CI/CD Kubernetes deployment"}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-demo
  namespace: devops-demo
spec:
  selector: {app: cicd-demo}
  ports: [{name: http, port: 80, targetPort: http}]
