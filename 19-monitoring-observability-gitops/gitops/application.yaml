apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-gitops-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/not-so-shubh/devops-homework.git
    targetRevision: main
    path: 19-monitoring-observability-gitops/gitops/workload
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
