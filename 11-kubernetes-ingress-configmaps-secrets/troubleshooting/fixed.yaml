apiVersion: v1
kind: ConfigMap
metadata: {name: session12-trouble, namespace: ingress-lab}
data: {APP_MODE: production}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: session12-trouble, namespace: ingress-lab}
spec:
  replicas: 1
  selector:
    matchLabels: {app: session12-trouble}
  template:
    metadata:
      labels: {app: session12-trouble}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef: {name: session12-trouble, key: APP_MODE}
          readinessProbe: {httpGet: {path: /, port: 80}}
---
apiVersion: v1
kind: Service
metadata: {name: session12-trouble, namespace: ingress-lab}
spec:
  selector: {app: session12-trouble}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: session12-trouble, namespace: ingress-lab}
spec:
  ingressClassName: nginx
  rules:
    - host: trouble.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: session12-trouble
                port: {number: 80}
