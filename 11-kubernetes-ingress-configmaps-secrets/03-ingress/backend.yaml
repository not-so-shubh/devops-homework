apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-backend
  template:
    metadata:
      labels:
        app: campus-backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          command:
            - python
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body=b'campus backend\n'
                      self.send_response(200); self.end_headers(); self.wfile.write(body)
              HTTPServer(('0.0.0.0',8080),H).serve_forever()
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: campus-backend
spec:
  selector:
    app: campus-backend
  ports:
    - port: 8080
      targetPort: 8080
