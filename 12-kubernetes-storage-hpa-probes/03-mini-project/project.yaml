apiVersion: v1
kind: ConfigMap
metadata:
  name: session13-project-config
  namespace: session13
data:
  index.html: |
    <!doctype html><html><body><h1>Session 13 Kubernetes Mini Project</h1><p>Storage, probes and autoscaling are configured.</p></body></html>
---
apiVersion: v1
kind: Secret
metadata:
  name: session13-project-secret
  namespace: session13
type: Opaque
stringData:
  demo-token: lab-only-not-a-real-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: session13-project-cache
  namespace: session13
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session13-project
  namespace: session13
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session13-project
  template:
    metadata:
      labels:
        app: session13-project
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: session13-project-secret
                  key: demo-token
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet: {path: /, port: 80}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
            - name: cache
              mountPath: /var/cache/session13
      volumes:
        - name: content
          configMap:
            name: session13-project-config
        - name: cache
          persistentVolumeClaim:
            claimName: session13-project-cache
---
apiVersion: v1
kind: Service
metadata:
  name: session13-project
  namespace: session13
spec:
  selector:
    app: session13-project
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: session13-project
  namespace: session13
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: session13-project
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: session13-project
  namespace: session13
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: session13-project
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: session13-project
  namespace: session13
spec:
  ingressClassName: nginx
  rules:
    - host: session13.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: session13-project
                port:
                  number: 80
