apiVersion: batch/v1
kind: Job
metadata:
  name: load-generator
  namespace: session13
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              i=0
              while [ "$i" -lt 20000 ]; do
                wget -q -O- http://hpa-web.session13.svc.cluster.local/ >/dev/null
                i=$((i + 1))
              done
