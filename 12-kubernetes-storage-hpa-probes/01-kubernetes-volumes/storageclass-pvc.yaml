apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-data
  namespace: session13
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: dynamic-pvc-demo
  namespace: session13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo dynamically-provisioned > /data/result.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dynamic-data
