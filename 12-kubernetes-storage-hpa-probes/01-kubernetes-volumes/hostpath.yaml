apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  namespace: session13
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo hostPath-demo > /data/result.txt; sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: node-data
          mountPath: /data
  volumes:
    - name: node-data
      hostPath:
        path: /tmp/session13-hostpath
        type: DirectoryOrCreate
