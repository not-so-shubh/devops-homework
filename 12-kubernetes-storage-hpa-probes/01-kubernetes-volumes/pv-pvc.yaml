apiVersion: v1
kind: PersistentVolume
metadata:
  name: session13-manual-pv
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/session13-manual
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manual-data
  namespace: session13
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: manual-pvc-demo
  namespace: session13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo persistent-data > /data/result.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: manual-data
