apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-recreate
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app-recreate
  template:
    metadata:
      labels:
        app: app-recreate
        version: v2
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /www; echo 'VERSION: v2 (UPGRADED)' > /www/index.html; httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
