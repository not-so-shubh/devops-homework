apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
      slot: green
  template:
    metadata:
      labels:
        app: myapp
        slot: green
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /www; echo '<p>GREEN ENVIRONMENT</p>' > /www/index.html; httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
