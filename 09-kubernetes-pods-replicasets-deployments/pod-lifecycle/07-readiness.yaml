apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-readiness
spec:
  containers:
    - name: web
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          mkdir -p /www
          echo 'readiness demo' > /www/index.html
          (sleep 15; touch /tmp/ready) &
          httpd -f -p 8080 -h /www
      ports:
        - containerPort: 8080
      readinessProbe:
        exec:
          command: ["sh", "-c", "test -f /tmp/ready"]
        initialDelaySeconds: 1
        periodSeconds: 2
