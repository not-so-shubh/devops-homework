name: Final DevOps Project

on:
  push:
    branches: [main]
    paths:
      - "20-final-devops-project/**"
      - ".github/workflows/final-project.yml"
  pull_request:
    paths:
      - "20-final-devops-project/**"
      - ".github/workflows/final-project.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  PROJECT: 20-final-devops-project/final-devops-project
  IMAGE: ghcr.io/${{ github.repository_owner }}/final-devops-project

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - run: python -m py_compile "$PROJECT/application/app.py"
      - run: python -m unittest discover -s "$PROJECT/application/tests" -v

  source-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - run: pip install bandit pip-audit
      - name: SAST
        run: bandit -r "$PROJECT/application" -lll -iii
      - name: SCA
        run: pip-audit -r "$PROJECT/application/requirements.txt" --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ env.PROJECT }}/security/.gitleaks.toml

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - uses: azure/setup-helm@v5
      - uses: hashicorp/setup-terraform@v4
      - name: Kubernetes schema validation
        run: |
          kubectl kustomize "$PROJECT/kubernetes" > /tmp/final-kubernetes.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -ignore-missing-schemas < /tmp/final-kubernetes.yaml
      - name: Helm lint and render
        run: |
          helm lint "$PROJECT/helm/final-app"
          helm template final-app "$PROJECT/helm/final-app" --namespace final-devops > /tmp/final-app.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -ignore-missing-schemas < /tmp/final-app.yaml
      - name: Terraform formatting and validation
        working-directory: 20-final-devops-project/final-devops-project/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate

  container-security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: 20-final-devops-project/final-devops-project
          file: 20-final-devops-project/final-devops-project/docker/Dockerfile
          load: true
          push: false
          tags: final-devops-project:${{ github.sha }}
      - name: Container image security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: final-devops-project:${{ github.sha }}
          format: sarif
          output: final-trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: always()
        uses: actions/upload-artifact@v7
        with: {name: final-trivy-report, path: final-trivy.sarif}

  security-gate:
    runs-on: ubuntu-latest
    needs: [test, source-security, configuration, container-security]
    steps:
      - run: echo "Tests, SAST, SCA, secret scan, configuration validation and image scan passed."

  kubernetes-smoke-deploy:
    if: >-
      always() &&
      needs.security-gate.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    needs: [security-gate, publish]
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Build source revision for non-publishing events
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker build -f "$PROJECT/docker/Dockerfile" \
            -t "final-devops-project:${GITHUB_SHA}" "$PROJECT"
          echo "DEPLOY_IMAGE=final-devops-project:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull published immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker pull "${IMAGE}:${GITHUB_SHA}"
          echo "DEPLOY_IMAGE=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Create ephemeral Kubernetes cluster
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSLO https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          sha256sum --check kind-linux-amd64.sha256sum
          sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind
          kind create cluster --wait 180s
          kind load docker-image "$DEPLOY_IMAGE"
      - name: Helm deployment and verification
        run: |
          DEPLOY_REPOSITORY="${DEPLOY_IMAGE%:*}"
          DEPLOY_TAG="${DEPLOY_IMAGE##*:}"
          helm upgrade --install final-app "$PROJECT/helm/final-app" \
            --namespace final-devops --create-namespace --wait --timeout 5m \
            --set image.repository="$DEPLOY_REPOSITORY" \
            --set image.tag="$DEPLOY_TAG" \
            --set image.pullPolicy=IfNotPresent \
            --set ingress.enabled=false \
            --set autoscaling.enabled=false \
            --set persistence.enabled=false
          kubectl rollout status deployment/final-app -n final-devops --timeout=180s
          kubectl get deployment,pods,service,configmap,secret -n final-devops -o wide
          helm test final-app -n final-devops --logs --timeout 3m

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: security-gate
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: 20-final-devops-project/final-devops-project
          file: 20-final-devops-project/final-devops-project/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  external-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_FINAL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    needs: [publish, kubernetes-smoke-deploy]
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - uses: azure/setup-helm@v5
      - name: Configure cluster access
        env: {KUBE_CONFIG_DATA: "${{ secrets.KUBE_CONFIG }}"}
        run: |
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Helm deployment and verification
        run: |
          helm upgrade --install final-app "$PROJECT/helm/final-app" \
            --namespace final-devops --create-namespace --wait --timeout 5m \
            --set image.repository=${{ env.IMAGE }} --set image.tag=${{ github.sha }}
          kubectl rollout status deployment/final-app -n final-devops --timeout=180s
          helm test final-app -n final-devops
