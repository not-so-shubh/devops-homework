name: CI-CD Demo

on:
  push:
    branches: [main]
    paths:
      - "15-cicd-github-actions/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    paths:
      - "15-cicd-github-actions/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-homework

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 15-cicd-github-actions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m py_compile application/app.py
      - name: Unit tests
        run: |
          mkdir -p evidence
          python -m unittest discover -s application/tests -v 2>&1 | tee evidence/test-results.txt
      - name: Upload test artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.sha }}
          path: 15-cicd-github-actions/evidence/test-results.txt
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build immutable image
        uses: docker/build-push-action@v7
        with:
          context: 15-cicd-github-actions
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/cicd-image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: container-image-${{ github.sha }}
          path: /tmp/cicd-image.tar
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish SHA and latest tags
        uses: docker/build-push-action@v7
        with:
          context: 15-cicd-github-actions
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_KUBERNETES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - name: Configure least-privilege cluster access
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Deploy immutable image
        run: |
          kubectl apply -f 15-cicd-github-actions/kubernetes/namespace.yaml
          kubectl apply -f 15-cicd-github-actions/kubernetes/deployment.yaml
          kubectl set image deployment/cicd-demo app=${{ env.IMAGE_NAME }}:${{ github.sha }} -n devops-demo
          kubectl rollout status deployment/cicd-demo -n devops-demo --timeout=180s
