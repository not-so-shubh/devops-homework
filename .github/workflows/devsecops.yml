name: DevSecOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "16-devsecops-pipeline/**"
      - ".github/workflows/devsecops.yml"
  pull_request:
    paths:
      - "16-devsecops-pipeline/**"
      - ".github/workflows/devsecops.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devsecops-demo

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - run: python -m unittest discover -s 16-devsecops-pipeline/application/tests -v

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - run: pip install bandit[toml]
      - name: Bandit SAST gate
        run: bandit -r 16-devsecops-pipeline/application -lll -iii -f json -o bandit.json
      - if: always()
        uses: actions/upload-artifact@v7
        with: {name: bandit-report, path: bandit.json}

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - run: pip install pip-audit
      - name: Dependency vulnerability gate
        run: pip-audit -r 16-devsecops-pipeline/requirements.txt --strict

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: 16-devsecops-pipeline/security/.gitleaks.toml

  container-scan:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: 16-devsecops-pipeline
          push: false
          load: true
          tags: devsecops-demo:${{ github.sha }}
      - name: Trivy image gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-demo:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: always()
        uses: actions/upload-artifact@v7
        with: {name: trivy-report, path: trivy.sarif}

  security-gate:
    runs-on: ubuntu-latest
    needs: [unit-test, sast, sca, secret-scan, container-scan]
    steps:
      - run: echo "All build, test and security gates passed."

  kubernetes-smoke-deploy:
    if: >-
      always() &&
      needs.security-gate.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    needs: [security-gate, publish]
    steps:
      - uses: actions/checkout@v7
      - name: Build source revision for non-publishing events
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker build -t "devsecops-demo:${GITHUB_SHA}" 16-devsecops-pipeline
          echo "DEPLOY_IMAGE=devsecops-demo:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull published immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker pull "${IMAGE}:${GITHUB_SHA}"
          echo "DEPLOY_IMAGE=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Create ephemeral Kubernetes cluster
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSLO https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          sha256sum --check kind-linux-amd64.sha256sum
          sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind
          kind create cluster --wait 180s
          kind load docker-image "$DEPLOY_IMAGE"
      - name: Deploy and verify in Kubernetes
        run: |
          kubectl apply -f 16-devsecops-pipeline/kubernetes/namespace.yaml
          kubectl apply -f 16-devsecops-pipeline/kubernetes/application.yaml
          kubectl set image deployment/devsecops-demo app="$DEPLOY_IMAGE" -n devsecops
          kubectl patch deployment devsecops-demo -n devsecops --type=strategic \
            -p '{"spec":{"template":{"spec":{"containers":[{"name":"app","imagePullPolicy":"IfNotPresent"}]}}}}'
          kubectl rollout status deployment/devsecops-demo -n devsecops --timeout=180s
          kubectl get deployment,pods,service,networkpolicy -n devsecops -o wide
          kubectl port-forward service/devsecops-demo -n devsecops 18080:80 > /tmp/devsecops-port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!
          trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/health

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: security-gate
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: 16-devsecops-pipeline
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  external-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DEVSECOPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    needs: [publish, kubernetes-smoke-deploy]
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - name: Configure cluster access
        env: {KUBE_CONFIG_DATA: "${{ secrets.KUBE_CONFIG }}"}
        run: |
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Deploy scanned image
        run: |
          kubectl apply -f 16-devsecops-pipeline/kubernetes/namespace.yaml
          kubectl apply -f 16-devsecops-pipeline/kubernetes/application.yaml
          kubectl set image deployment/devsecops-demo app=${{ env.IMAGE }}:${{ github.sha }} -n devsecops
          kubectl rollout status deployment/devsecops-demo -n devsecops --timeout=180s
