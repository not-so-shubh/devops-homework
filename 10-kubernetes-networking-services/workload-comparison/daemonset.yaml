apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: identity-daemonset
spec:
  selector:
    matchLabels:
      app: identity-daemonset
  template:
    metadata:
      labels:
        app: identity-daemonset
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
