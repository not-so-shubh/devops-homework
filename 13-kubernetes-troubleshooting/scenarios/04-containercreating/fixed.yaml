apiVersion: v1
kind: ConfigMap
metadata:
  name: required-config
  namespace: session14
data:
  app.conf: "mode=healthy"
---
apiVersion: v1
kind: Pod
metadata:
  name: containercreating-demo
  namespace: session14
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "cat /config/app.conf; sleep 3600"]
      volumeMounts:
        - name: required-config
          mountPath: /config
  volumes:
    - name: required-config
      configMap:
        name: required-config
