apiVersion: v1
kind: Pod
metadata:
  name: containercreating-demo
  namespace: session14
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: required-config
          mountPath: /config
  volumes:
    - name: required-config
      configMap:
        name: missing-config
