apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-client-egress
  namespace: session14
spec:
  podSelector:
    matchLabels: {role: client}
  policyTypes: ["Egress"]
  egress: []
---
apiVersion: v1
kind: Pod
metadata:
  name: network-client
  namespace: session14
  labels: {role: client}
spec:
  containers:
    - name: client
      image: curlimages/curl:8.12.1
      command: ["sh", "-c", "sleep 3600"]
