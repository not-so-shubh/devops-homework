apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-demo
  namespace: session14
spec:
  replicas: 1
  selector:
    matchLabels: {app: service-demo}
  template:
    metadata:
      labels: {app: service-demo}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: service-demo
  namespace: session14
spec:
  selector: {app: service-demo}
  ports: [{port: 80, targetPort: 80}]
