apiVersion: v1
kind: Service
metadata:
  name: dns-service
  namespace: session14
spec:
  selector: {app: service-demo}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-demo
  namespace: session14
spec:
  restartPolicy: Never
  containers:
    - name: lookup
      image: busybox:1.36
      command: ["sh", "-c", "nslookup dns-service.session14.svc.cluster.local"]
