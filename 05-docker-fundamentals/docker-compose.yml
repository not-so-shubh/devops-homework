services:
  nodejs:
    image: devops-homework-nodejs:local
    build:
      context: ./nodejs-app
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${NODE_HOST_PORT:-3000}:3000"

  python:
    image: devops-homework-python:local
    build:
      context: ./python-app
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${PYTHON_HOST_PORT:-5000}:5000"

  java:
    image: devops-homework-java:local
    build:
      context: ./java-app
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${JAVA_HOST_PORT:-8081}:8080"

  apache:
    image: devops-homework-apache:local
    build:
      context: ./Apache-app
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${APACHE_HOST_PORT:-8082}:80"

  react:
    image: devops-homework-react:local
    build:
      context: ./React-app
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${REACT_HOST_PORT:-8083}:80"

  nginx:
    image: devops-homework-nginx:local
    build:
      context: ./nginx-app
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${NGINX_HOST_PORT:-8084}:80"
